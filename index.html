<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#0f0f0e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Gym Log</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f2; --card:#fcfcfb; --card2:#efeeeb; --text:#0b0b0b; --text2:#52514e; --muted:#7d7c77;
  --line:#e3e2de; --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb; --danger:#c93a39;
  --done:#e6f2e6; --done-ink:#006b00; --grid:#e6e5e1;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0f0f0e; --card:#1a1a19; --card2:#242422; --text:#f0efec; --text2:#c3c2b7; --muted:#8d8c84;
    --line:#2e2e2b; --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1c2a3b; --danger:#e66767;
    --done:#16301a; --done-ink:#7fd27f; --grid:#2a2a28;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(64px + var(--safe-b))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
.hidden{display:none!important}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid transparent}
header.top.scrolled{border-bottom-color:var(--line)}
header.top h1{font-size:20px;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .hbtn{color:var(--accent);font-weight:600;padding:6px 4px;font-size:16px}
header.top .hbtn.primary{background:var(--accent);color:var(--accent-ink);padding:6px 14px;border-radius:999px}
header.top .hbtn.danger{color:var(--danger)}

main{padding:8px 16px 24px;max-width:640px;margin:0 auto}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--muted);font-weight:500}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}

.resume{position:fixed;left:12px;right:12px;bottom:calc(68px + var(--safe-b));z-index:25;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:608px;margin:0 auto}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 4px 6px}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:12px;font-weight:600;background:var(--card2);margin:8px 0}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{color:var(--danger)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .t{font-weight:600}
.chev{color:var(--muted)}
.field{display:block;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);outline:none}
.field:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips button{flex:none;padding:6px 12px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600;color:var(--text2)}
.chips button.on{background:var(--accent);color:var(--accent-ink)}

/* history */
.wcard h3{margin:0;font-size:17px}
.wcard .meta{font-size:13px;color:var(--muted);margin:2px 0 8px}
.wcard .ex{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0}
.wcard .ex span:last-child{color:var(--text2);white-space:nowrap}

/* editor */
.wname{font-size:22px;font-weight:700;border:0;background:transparent;width:100%;padding:4px 0;outline:none}
.metarow{display:grid;grid-template-columns:1fr 110px;gap:8px;margin:6px 0 4px}
.metarow label{font-size:12px;color:var(--muted);font-weight:600}
.metarow input{margin-top:3px;padding:8px 10px}
.excard{padding:12px 10px 8px}
.excard .exhead{display:flex;align-items:center;gap:6px;padding:0 4px 8px}
.excard .exhead .name{font-weight:700;color:var(--accent);flex:1;font-size:16px}
.grid{display:grid;grid-template-columns:30px minmax(64px,1fr) 64px 52px 46px 40px;gap:6px;align-items:center}
.grid.head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:0 2px 4px;text-align:center}
.grid.head div:nth-child(2){text-align:left}
.setrow{padding:3px 2px;border-radius:8px}
.setrow.done{background:var(--done)}
.setrow .no{text-align:center;font-weight:700;font-size:14px;color:var(--text2);padding:6px 0;border-radius:6px}
.setrow .prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setrow input{width:100%;text-align:center;padding:7px 2px;border-radius:8px;border:1px solid transparent;background:var(--card2);font-weight:600;font-size:16px;outline:none}
.setrow input:focus{border-color:var(--accent)}
.setrow.done input{background:transparent}
.chk{width:36px;height:32px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;margin:auto}
.setrow.done .chk{background:#1f8a3b;color:#fff}
.chk svg{width:18px;height:18px}
.exfoot{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 0;gap:8px}
.exfoot .addset{color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
.exfoot .sum{font-size:12px;color:var(--muted);text-align:right}
.timer{font-variant-numeric:tabular-nums}
textarea.field{min-height:70px;resize:vertical}

/* exercise detail */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .d{font-size:12px;color:var(--muted)}
.chart{position:relative;margin-top:6px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;overflow:visible}
.chart .axis{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ln{stroke:var(--accent);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .xh{stroke:var(--text2);stroke-width:1;stroke-dasharray:3 3}
.chart .lbl{fill:var(--text);font-size:12px;font-weight:700}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tip b{font-size:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.tbl td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.tbl td.r,table.tbl th.r{text-align:right}

/* modal */
#modal{position:fixed;inset:0;z-index:100}
#modal .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#modal .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--safe-b));max-width:640px;margin:0 auto;animation:up .18s ease-out}
#modal .sheet.center{top:50%;bottom:auto;left:16px;right:16px;transform:translateY(-50%);border-radius:16px;animation:none;max-width:420px}
#modal h2{margin:0 0 6px;font-size:18px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);z-index:200;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw}
.banner{background:var(--card2);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--text2);margin:6px 0}
</style>
</head>
<body>
<header class="top" id="hdr"></header>
<main id="main"></main>
<div id="resume"></div>
<nav class="tabs" id="tabs">
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Verlauf</button>
  <button data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Training</button>
  <button data-tab="exercises"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg>Übungen</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Mehr</button>
</nav>
<div id="modal" hidden></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const fmt = (n, d = 1) => n == null ? "–" : n.toLocaleString("de-DE", { maximumFractionDigits: d });
const dec = v => v == null ? "" : String(v).replace(".", ",");
const clone = o => JSON.parse(JSON.stringify(o));
const DAY = 864e5;
const CATS = ["Brust", "Rücken", "Beine", "Schultern", "Arme", "Core", "Sonstige"];
const SEED = [
  ["Bankdrücken (Langhantel)", "Brust"], ["Schrägbankdrücken (Kurzhantel)", "Brust"], ["Butterfly (Maschine)", "Brust"], ["Dips", "Brust"],
  ["Kreuzheben", "Rücken"], ["Klimmzüge", "Rücken"], ["Latzug", "Rücken"], ["Rudern (Langhantel)", "Rücken"], ["Rudern (Kabel, sitzend)", "Rücken"],
  ["Kniebeuge (Langhantel)", "Beine"], ["Beinpresse", "Beine"], ["Rumänisches Kreuzheben", "Beine"], ["Ausfallschritte", "Beine"], ["Beinstrecker", "Beine"], ["Beinbeuger", "Beine"], ["Hip Thrust", "Beine"], ["Wadenheben", "Beine"],
  ["Schulterdrücken (Langhantel)", "Schultern"], ["Schulterdrücken (Kurzhantel)", "Schultern"], ["Seitheben", "Schultern"], ["Face Pulls", "Schultern"],
  ["Bizepscurls (Kurzhantel)", "Arme"], ["Hammercurls", "Arme"], ["Trizepsdrücken (Kabel)", "Arme"], ["French Press (SZ)", "Arme"],
  ["Plank", "Core"], ["Beinheben hängend", "Core"], ["Crunches (Kabel)", "Core"]
];
const fmtDate = (iso, opt = { weekday: "short", day: "numeric", month: "short", year: "numeric" }) => new Date(iso).toLocaleDateString("de-DE", opt);
const fmtTime = iso => new Date(iso).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const toLocalInput = iso => { const d = new Date(iso); const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };

/* ---------- state ---------- */
let S = { meta: { settings: { unit: "kg", formula: "epley" }, exercises: [], deleted: {}, updatedAt: 0 }, workouts: [], draft: null };
let nav = { tab: "history", stack: [] };
let editor = null; // { mode: 'active'|'edit', w }
let ui = { exSearch: "", exCat: "Alle", metric: "e1rm", range: "all", table: false, pickerSearch: "" };
const unit = () => S.meta.settings.unit;
const exById = id => S.meta.exercises.find(e => e.id === id);
const exName = id => exById(id)?.name || "Unbekannte Übung";

function seedMeta() {
  S.meta.exercises = SEED.map(([name, cat], i) => ({ id: "s" + i, name, cat }));
  S.meta.updatedAt = Date.now();
}

/* ---------- 1RM ---------- */
function e1rm(w, r, rir) {
  if (w == null || r == null || w <= 0 || r <= 0) return null;
  const n = r + (rir || 0);
  if (n <= 1) return w;
  if (S.meta.settings.formula === "brzycki") return n >= 37 ? null : w * 36 / (37 - n);
  return w * (1 + n / 30);
}
function bestSet(sets) {
  let best = null, bv = -1;
  for (const s of sets) { const v = e1rm(s.w, s.r, s.rir); if (v != null && v > bv) { bv = v; best = s; } }
  return best ? { set: best, e1rm: bv } : null;
}
const setLabel = s => `${s.w ? fmt(s.w, 2) + " " + unit() + " × " : ""}${s.r ?? "–"}${s.w ? "" : " Wdh."}${s.rir != null ? " @" + fmt(s.rir) + " RIR" : ""}`;
const setShort = s => s ? `${s.w ? fmt(s.w, 2) + "×" : ""}${s.r ?? "–"}${s.rir != null ? " @" + fmt(s.rir) : ""}` : "–";
const sortedWorkouts = () => [...S.workouts].sort((a, b) => b.date.localeCompare(a.date));
function volume(w) { let v = 0; for (const e of w.exercises) for (const s of e.sets) v += (s.w || 0) * (s.r || 0); return v; }

function prMap() { // workoutId -> [exId] where best e1RM beat all earlier sessions
  const best = {}, res = {};
  for (const w of [...S.workouts].sort((a, b) => a.date.localeCompare(b.date))) {
    for (const e of w.exercises) {
      const b = bestSet(e.sets); if (!b) continue;
      if (best[e.exId] != null && b.e1rm > best[e.exId] + 1e-9) (res[w.id] ||= []).push(e.exId);
      if (best[e.exId] == null || b.e1rm > best[e.exId]) best[e.exId] = b.e1rm;
    }
  }
  return res;
}
function previousFor(exId, excludeId, beforeIso) {
  for (const w of sortedWorkouts()) {
    if (w.id === excludeId) continue;
    if (beforeIso && w.date >= beforeIso) continue;
    const e = w.exercises.find(x => x.exId === exId);
    if (e) return e.sets;
  }
  return null;
}

/* ---------- storage ---------- */
const LS_KEY = "gymlog.v1";
const Store = {
  mode: "local", db: null, uid: null, queue: {}, note: "",
  readLocal() { try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; } },
  writeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch {} },
  wRef(id) { return this.db.doc(`data/users/${this.uid}/meta`).collection("workouts").doc(id); },
  async write(key, fn) { // one write at a time per doc; coalesce to latest
    const q = this.queue[key] ||= { busy: false, next: null };
    q.next = fn;
    if (q.busy) return;
    q.busy = true;
    while (q.next) {
      const f = q.next; q.next = null;
      try { await f(); }
      catch (e) {
        if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 500 + Math.random() * 1000)); try { await f(); continue; } catch {} }
        toast(e && e.code === "quota_exceeded" ? "Cloud-Speicher voll – bitte Backup exportieren" : "Cloud-Speichern fehlgeschlagen – lokal gesichert");
      }
    }
    q.busy = false;
  },
  saveMeta() {
    S.meta.updatedAt = Date.now(); this.writeLocal();
    if (this.mode === "cloud") { const m = clone(S.meta); this.write("meta", () => this.db.doc(`data/users/${this.uid}/meta`).set(m)); }
  },
  saveWorkout(w) {
    w.updatedAt = Date.now(); this.writeLocal();
    if (this.mode === "cloud") { const c = clone(w); this.write("w:" + w.id, () => this.wRef(c.id).set(c)); }
  },
  deleteWorkout(id) {
    S.meta.deleted[id] = Date.now();
    this.saveMeta();
    if (this.mode === "cloud") this.write("w:" + id, () => this.wRef(id).delete());
  },
  saveDraft() {
    if (S.draft) S.draft.updatedAt = Date.now();
    this.writeLocal();
    if (this.mode === "cloud") {
      const d = S.draft ? clone(S.draft) : null;
      this.write("draft", () => this.db.doc(`data/users/${this.uid}/draft`).set({ draft: d, updatedAt: Date.now() }));
    }
  },
  async connect() {
    if (!(window.claude && typeof window.claude.use === "function")) return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      this.db = db; this.uid = uid;
      const timeout = new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), 10000));
      const [metaSnap, draftSnap, wSnap] = await Promise.race([Promise.all([
        db.doc(`data/users/${uid}/meta`).get(),
        db.doc(`data/users/${uid}/draft`).get(),
        db.doc(`data/users/${uid}/meta`).collection("workouts").get()
      ]), timeout]);
      this.mode = "cloud";
      const rMeta = metaSnap.exists ? metaSnap.data() : null;
      const rDraft = draftSnap.exists ? draftSnap.data() : null;
      const rWorkouts = wSnap.docs.map(d => d.data());
      this.merge(rMeta, rDraft, rWorkouts);
      this.note = "";
      render();
    } catch (e) {
      if (this.db) { this.mode = "local"; this.note = "Cloud gerade nicht erreichbar – Änderungen werden vorerst nur in diesem Browser gespeichert."; render(); }
    }
  },
  merge(rMeta, rDraft, rWorkouts) {
    const localHasData = S.workouts.length > 0 || S.draft;
    // meta
    const deleted = Object.assign({}, rMeta?.deleted || {}, S.meta.deleted || {});
    let metaUpload = false;
    if (rMeta && (!S.meta.updatedAt || rMeta.updatedAt >= S.meta.updatedAt || !localHasData)) S.meta = clone(rMeta);
    else metaUpload = true;
    S.meta.deleted = deleted;
    // workouts: union, newest wins, tombstones win
    const map = new Map();
    for (const w of rWorkouts) map.set(w.id, { w, src: "r" });
    const uploads = [];
    for (const w of S.workouts) {
      const r = map.get(w.id);
      if (!r || (w.updatedAt || 0) > (r.w.updatedAt || 0)) { map.set(w.id, { w, src: "l" }); uploads.push(w); }
    }
    const remoteDeletes = [];
    for (const [id, v] of map) if (deleted[id]) { map.delete(id); if (v.src === "r") remoteDeletes.push(id); }
    S.workouts = [...map.values()].map(v => v.w);
    // draft
    const rd = rDraft?.draft || null;
    if (rDraft && (!S.draft || (rDraft.updatedAt || 0) >= (S.draft.updatedAt || 0))) S.draft = rd;
    this.writeLocal();
    if (metaUpload || !rMeta) this.saveMeta();
    for (const w of uploads) { const c = clone(w); this.write("w:" + c.id, () => this.wRef(c.id).set(c)); }
    for (const id of remoteDeletes) this.write("w:" + id, () => this.wRef(id).delete());
    if (S.draft && (!rDraft || (S.draft.updatedAt || 0) > (rDraft.updatedAt || 0))) this.saveDraft();
    if (editor && editor.mode === "active") { if (S.draft) editor.w = S.draft; else editor = null; }
  }
};

/* ---------- UI primitives ---------- */
function toast(msg, ms = 2600) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
function openModal(html, { center = false } = {}) {
  const m = $("#modal");
  m.innerHTML = `<div class="backdrop" data-close></div><div class="sheet${center ? " center" : ""}">${html}</div>`;
  m.hidden = false;
  return m;
}
function closeModal() { const m = $("#modal"); m.hidden = true; m.innerHTML = ""; m.onclick = null; m.oninput = null; }
function ask(title, text, buttons) {
  return new Promise(res => {
    const m = openModal(`<h2>${esc(title)}</h2>${text ? `<p class="muted" style="margin:0 0 12px">${esc(text)}</p>` : ""}

/* ---------- render ---------- */
function render() {

function elapsed(iso) {
  const s = Math.max(0, Math.floor((Date.now() - new Date(iso)) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0");
}

function exSummary(e) {
  const counted = e.sets.filter(s => editor.mode === "edit" || s.done);
  const b = bestSet(counted);
  if (!b) return "";
  const prevBest = allTimeBest(e.exId, editor.w.id);
  const isPr = prevBest != null && b.e1rm > prevBest + 1e-9;
  return `e1RM ${fmt(b.e1rm)} ${unit()}${isPr ? ' <span class="badge">🏆 PR</span>' : ""}`;
}
function allTimeBest(exId, excludeId) {

  for (const w of S.workouts) { if (w.id === excludeId) continue; for (const e of w.exercises) if (e.exId === exId) { const b = bestSet(e.sets); if (b && (best == null || b.e1rm > best)) best = b.e1rm; } }
  return best;
}

async function finishEditor() {
  const w = editor.w, active = editor.mode === "active";
  let keepOpen = true;
  if (active) {
    const open = w.exercises.reduce((n, e) => n + e.sets.filter(s => !s.done && (s.w != null || s.r != null)).length, 0);
    if (open) {
      const a = await ask("Nicht abgehakte Sätze", `${open} ${open === 1 ? "Satz hat" : "Sätze haben"} Werte, ${open === 1 ? "ist" : "sind"} aber nicht abgehakt.`,
        [{ label: "Trotzdem übernehmen", value: "keep", style: "primary" }, { label: "Weglassen", value: "drop" }, { label: "Zurück", value: null }]);
      if (!a) return;
      keepOpen = a === "keep";
    }
  }
  const clean = {
    id: w.id, name: (w.name || "").trim() || defaultName(new Date(w.date)), date: w.date, notes: (w.notes || "").trim(), duration: w.duration ?? null,
    exercises: w.exercises.map(e => ({ exId: e.exId, sets: e.sets
      .filter(s => s.r != null && s.r > 0 && (!active || s.done || keepOpen))
      .map(s => ({ w: s.w ?? 0, r: s.r, rir: s.rir })) })).filter(e => e.sets.length)
  };
  if (!clean.exercises.length) {
    const a = await ask("Keine Sätze", "Es gibt keine Sätze mit Wiederholungen. Training verwerfen?", [{ label: "Verwerfen", value: "discard", style: "danger" }, { label: "Zurück", value: null }]);
    if (!a) return;
    if (active) { S.draft = null; Store.saveDraft(); }
    editor = null; return go(active ? "workout" : nav.tab);
  }
  if (active && clean.duration == null) { const mins = Math.round((Date.now() - new Date(w.date)) / 60000); clean.duration = mins > 0 && mins < 600 ? mins : null; }
  const before = prMap();
  const i = S.workouts.findIndex(x => x.id === clean.id);
  if (i >= 0) S.workouts[i] = Object.assign(S.workouts[i], clean); else S.workouts.push(clean);
  Store.saveWorkout(S.workouts.find(x => x.id === clean.id));
  if (active) { S.draft = null; Store.saveDraft(); }
  editor = null;
  const prs = prMap()[clean.id] || [];
  const newPrs = prs.filter(x => !(before[clean.id] || []).includes(x));
  if (newPrs.length) toast(`🏆 Neuer Rekord: ${newPrs.map(exName).join(", ")}`, 3500);
  else toast(active ? "Training gespeichert 💪" : "Gespeichert");
  nav.tab = "history"; nav.stack = [{ type: "workout", id: clean.id }]; render(); window.scrollTo(0, 0);
}

/* ----- exercises ----- */
function exStats() {
  const st = {};
  for (const w of S.workouts) for (const e of w.exercises) {
    const s = st[e.exId] ||= { n: 0, last: "", best: null };
    s.n++; if (w.date > s.last) s.last = w.date;
    const b = bestSet(e.sets); if (b && (s.best == null || b.e1rm > s.best)) s.best = b.e1rm;
  }
  return st;
}
function renderExercises(main) {

    .sort((a, b) => (st[b.id]?.n || 0) - (st[a.id]?.n || 0) || a.name.localeCompare(b.name, "de"));
  main.innerHTML = `<input class="field" id="exq" placeholder="Übung suchen …" value="${esc(ui.exSearch)}" style="margin:4px 0 8px">

    <div class="list" id="exlist">${list.map(e => { const s = st[e.id]; return `<div class="li" data-a="open-ex" data-id="${e.id}"><div class="sp"><div class="t">${esc(e.name)}</div>
      <div class="muted small">${s ? `${s.n}× · zuletzt ${fmtDate(s.last, { day: "numeric", month: "short", year: "2-digit" })}` : e.cat}</div></div>
      ${s?.best ? `<div style="text-align:right"><div style="font-weight:700">${fmt(s.best)}</div><div class="muted small">e1RM ${unit()}</div></div>` : ""}<span class="chev">›</span></div>`; }).join("") || `<div class="empty">Nichts gefunden.</div>`}</div>`;
}

const METRICS = {
  e1rm: { label: "Geschätztes 1RM", short: "e1RM", u: () => unit() },
  maxw: { label: "Höchstes Gewicht", short: "Max.", u: () => unit() },
  vol: { label: "Volumen", short: "Volumen", u: () => unit() },
  reps: { label: "Meiste Wdh.", short: "Wdh.", u: () => "Wdh." }
};
function sessions(exId) {
  const out = [];
  for (const w of S.workouts) for (const e of w.exercises) if (e.exId === exId) {
    const b = bestSet(e.sets);
    out.push({ w, sets: e.sets, t: new Date(w.date).getTime(),
      e1rm: b ? b.e1rm : null, best: b?.set || null,
      maxw: Math.max(0, ...e.sets.map(s => s.w || 0)) || null,
      vol: e.sets.reduce((v, s) => v + (s.w || 0) * (s.r || 0), 0) || null,
      reps: Math.max(0, ...e.sets.map(s => s.r || 0)) || null });
  }
  return out.sort((a, b) => a.t - b.t);
}
function renderExerciseDetail(main, id) {
  const ex = exById(id); if (!ex) { nav.stack.pop(); return render(); }
  header("Übung", backBtn(), `<button class="hbtn" data-a="edit-ex" data-id="${id}">Bearbeiten</button>`);
  const ss = sessions(id);
  const hasW = ss.some(s => s.e1rm != null);
  let metric = ui.metric; if (!hasW && (metric === "e1rm" || metric === "maxw" || metric === "vol")) metric = "reps";
  const rangeDays = { "3m": 91, "6m": 182, "1y": 365, all: Infinity }[ui.range];
  const cutoff = Date.now() - rangeDays * DAY;
  const pts = ss.filter(s => s.t >= cutoff && s[metric] != null).map(s => ({ t: s.t, v: s[metric], s }));
  // records
  const rec = (key) => { let b = null; for (const s of ss) if (s[key] != null && (!b || s[key] > b[key])) b = s; return b; };

  main.innerHTML = `<h2 style="margin:6px 0 0">${esc(ex.name)}</h2><div class="muted small">${ex.cat} · ${ss.length} ${ss.length === 1 ? "Einheit" : "Einheiten"}</div>

    <div class="row"><div class="chips sp">${[["3m", "3 Mon."], ["6m", "6 Mon."], ["1y", "1 Jahr"], ["all", "Alles"]].map(([k, l]) => `<button class="${ui.range === k ? "on" : ""}" data-a="range" data-r="${k}">${l}</button>`).join("")}</div>
      <button class="hbtn small" style="color:var(--accent);font-weight:600" data-a="toggle-table">${ui.table ? "Grafik" : "Tabelle"}</button></div>
    <div class="card" style="padding:12px 10px 8px"><div class="small" style="font-weight:600;color:var(--text2);padding:0 4px">${METRICS[metric].label} pro Einheit (${METRICS[metric].u()})</div>
      ${ui.table ? tableHtml(pts, metric) : `<div class="chart" id="chart"></div>`}</div>
    <div class="sec">Rekorde</div>
    <div class="stat-grid">
      ${hasW ? stat("Bestes e1RM", r1?.e1rm, unit(), r1, r1 ? setLabel(r1.best) : null) : ""}
      ${hasW ? stat("Höchstes Gewicht", rw?.maxw, unit(), rw) : ""}
      ${stat("Meiste Wdh. (Satz)", rr?.reps, "", rr)}
      ${hasW ? stat("Größtes Volumen", rv?.vol, unit(), rv) : ""}
    </div>
    ${hasW ? `<div class="sec">Bestes Gewicht nach Wiederholungen</div><div class="card" style="padding:6px 12px"><table class="tbl">
      <tr><th>Wdh.</th><th class="r">Gewicht</th><th class="r">Satz</th><th class="r">Datum</th></tr>
      ${repBest.map(([n, b]) => `<tr><td>${n}${n > 1 ? "+" : ""}</td><td class="r"><b>${b ? fmt(b.w, 2) + " " + unit() : "–"}</b></td><td class="r muted">${b ? esc(setShort(b)) : ""}</td><td class="r muted">${b ? fmtDate(b.date, { day: "2-digit", month: "2-digit", year: "2-digit" }) : ""}</td></tr>`).join("")}
    </table></div>` : ""}
    <div class="sec">Verlauf</div>
    ${[...ss].reverse().map(s => `<div class="card tap" data-a="open-workout" data-id="${s.w.id}"><div class="row"><b class="sp">${fmtDate(s.w.date)}</b>${s.e1rm != null ? `<span class="muted small">e1RM ${fmt(s.e1rm)} ${unit()}</span>` : ""}</div>
      <div class="small" style="color:var(--text2);margin-top:4px">${s.sets.map(x => esc(setShort(x))).join(" · ")}</div></div>`).join("")}
    ` : `<div class="empty">Noch keine Sätze für diese Übung. Sobald du sie in einem Training einträgst, erscheinen hier Graph und Rekorde.</div>`}

  if (ss.length && !ui.table) drawChart($("#chart"), pts, metric);

function tableHtml(pts, metric) {
  if (!pts.length) return `<div class="empty">Keine Daten im gewählten Zeitraum.</div>`;
  return `<table class="tbl" style="margin-top:6px"><tr><th>Datum</th><th>Bester Satz</th><th class="r">${METRICS[metric].short}</th></tr>
    ${[...pts].reverse().map(p => `<tr><td>${fmtDate(p.s.w.date, { day: "2-digit", month: "2-digit", year: "2-digit" })}</td><td class="muted">${esc(setShort(p.s.best || p.s.sets[0]))}</td><td class="r"><b>${fmt(p.v)}</b></td></tr>`).join("")}</table>`;
}

/* ----- chart (single series line, crosshair + tooltip) ----- */
function niceTicks(min, max, count = 4, minStep = 0) {
  if (min === max) { const pad = Math.max(1, Math.abs(min) * 0.05); min -= pad; max += pad; }
  const raw = (max - min) / count, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag;
  const step = Math.max(minStep, (f >= 7.5 ? 10 : f >= 3.5 ? 5 : f >= 1.5 ? 2 : 1) * mag);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  return { lo, hi, ticks };
}
function drawChart(box, pts, metric) {
  if (!box) return;
  if (!pts.length) { box.innerHTML = `<div class="empty">Keine Daten im gewählten Zeitraum.</div>`; return; }
  const W = Math.max(260, box.clientWidth), H = 220, L = 42, R = 16, T = 22, B = 26;
  let t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  if (t1 - t0 < DAY) { t0 -= 3 * DAY; t1 += 3 * DAY; }
  const vs = pts.map(p => p.v);
  const { lo, hi, ticks } = niceTicks(Math.min(...vs), Math.max(...vs), 4, metric === "reps" ? 1 : 0);
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const span = t1 - t0;
  const xFmt = t => new Date(t).toLocaleDateString("de-DE", span > 300 * DAY ? { month: "short", year: "2-digit" } : { day: "numeric", month: "short" });
  const nx = Math.max(2, Math.min(5, Math.floor((W - L - R) / 80)));
  const xt = Array.from({ length: nx }, (_, i) => t0 + span * i / (nx - 1));
  const d = pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + "," + y(p.v).toFixed(1)).join("");
  const last = pts[pts.length - 1];
  const decimals = metric === "vol" || metric === "reps" ? 0 : 1;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${METRICS[metric].label} über die Zeit">
    ${ticks.map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v, 1)}</text>`).join("")}
    ${xt.map((t, i) => `<text class="axis" x="${x(t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === nx - 1 ? "end" : "middle"}">${xFmt(t)}</text>`).join("")}
    <path class="ln" d="${d}"/>
    ${pts.map(p => `<circle class="pt" cx="${x(p.t)}" cy="${y(p.v)}" r="4"/>`).join("")}
    <text class="lbl" x="${Math.min(x(last.t), W - R)}" y="${y(last.v) - 10}" text-anchor="${x(last.t) > W - 60 ? "end" : "middle"}">${fmt(last.v, decimals)}</text>
    <line class="xh" id="xh" y1="${T}" y2="${H - B}" style="display:none"/>
    <circle id="xp" r="6" fill="var(--accent)" stroke="var(--card)" stroke-width="2" style="display:none"/>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="hit"/>
  </svg><div class="tip" id="tip" style="display:none"></div>`;
  const svg = box.querySelector("svg"), tip = box.querySelector("#tip"), xh = box.querySelector("#xh"), xp = box.querySelector("#xp");
  const show = ev => {
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * (W / rect.width);
    let best = pts[0], bd = Infinity;
    for (const p of pts) { const dd = Math.abs(x(p.t) - px); if (dd < bd) { bd = dd; best = p; } }
    const cx = x(best.t), cy = y(best.v);
    xh.setAttribute("x1", cx); xh.setAttribute("x2", cx); xh.style.display = "";
    xp.setAttribute("cx", cx); xp.setAttribute("cy", cy); xp.style.display = "";
    const s = best.s;
    tip.innerHTML = `${fmtDate(s.w.date, { day: "numeric", month: "short", year: "numeric" })}<br><b>${fmt(best.v, decimals)} ${METRICS[metric].u()}</b>${s.best ? `<br>${esc(setLabel(s.best))}` : ""}`;
    tip.style.display = "";
    const sx = cx * rect.width / W, tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(sx, tw / 2 + 2), rect.width - tw / 2 - 2) + "px";
    tip.style.top = (cy * rect.height / H) + "px";
  };
  const hide = () => { tip.style.display = "none"; xh.style.display = "none"; xp.style.display = "none"; };
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hide(); });
}

function backupJson() { return JSON.stringify({ app: "gymlog", version: 1, exportedAt: new Date().toISOString(), meta: S.meta, workouts: S.workouts }, null, 1); }
function importData(text) {
  let d; try { d = JSON.parse(text); } catch { return toast("Ungültige Datei"); }
  if (!d || d.app !== "gymlog" || !Array.isArray(d.workouts) || !d.meta) return toast("Das ist kein Gym-Log-Backup");
  return ask("Backup importieren", `${d.workouts.length} Trainings. Vorhandene Daten werden zusammengeführt (gleiche Trainings werden überschrieben).`, [{ label: "Importieren", value: true, style: "primary" }, { label: "Abbrechen", value: null }]).then(ok => {
    if (!ok) return;
    const exMap = new Map(S.meta.exercises.map(e => [e.id, e]));
    for (const e of d.meta.exercises || []) exMap.set(e.id, e);
    S.meta.exercises = [...exMap.values()];
    S.meta.settings = Object.assign({}, S.meta.settings, d.meta.settings || {});
    Store.saveMeta();
    for (const w of d.workouts) {
      delete S.meta.deleted[w.id];
      const i = S.workouts.findIndex(x => x.id === w.id);
      if (i >= 0) S.workouts[i] = w; else S.workouts.push(w);
      Store.saveWorkout(w);
    }
    Store.saveMeta();
    toast(`${d.workouts.length} Trainings importiert`); render();
  });
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const tabBtn = e.target.closest("#tabs button");
  if (tabBtn) {
    const t = tabBtn.dataset.tab;
    if (t === "workout" && S.draft && !editor) editor = { mode: "active", w: S.draft };
    if (t === "workout" && editor && editor.mode === "edit") editor = S.draft ? { mode: "active", w: S.draft } : null;
    return go(t);
  }
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  const row = el.closest(".setrow");
  switch (a) {
    case "back": if (cur()?.type === "editor") editor = S.draft ? { mode: "active", w: S.draft } : null; back(); break;
    case "tab": go(el.dataset.tab); break;
    case "resume": editor = { mode: "active", w: S.draft }; go("workout"); break;
    case "open-workout": push({ type: "workout", id }); break;
    case "open-ex": push({ type: "exercise", id }); break;
    case "start": startWorkout(); break;
    case "log-past": logPast(); break;
    case "repeat": startWorkout(id); break;
    case "edit-workout": { const w = S.workouts.find(x => x.id === id); editor = { mode: "edit", w: clone(w) }; editor.w.exercises.forEach(x => x.sets.forEach(s => s.done = true)); push({ type: "editor" }); break; }
    case "delete-workout": {
      const ok = await ask("Training löschen?", "Das kann nicht rückgängig gemacht werden.", [{ label: "Löschen", value: true, style: "danger" }, { label: "Abbrechen", value: null }]);
      if (ok) { S.workouts = S.workouts.filter(w => w.id !== id); Store.deleteWorkout(id); back(); toast("Training gelöscht"); }
      break;
    }
    case "cancel-workout": {
      const ok = await ask("Training verwerfen?", "Alle Eingaben dieses Trainings gehen verloren.", [{ label: "Verwerfen", value: true, style: "danger" }, { label: "Weiter trainieren", value: null }]);
      if (ok) { S.draft = null; editor = null; Store.saveDraft(); go("workout"); }
      break;
    }
    case "finish": finishEditor(); break;
    case "add-ex": openPicker(exId => { editor.w.exercises.push({ exId, sets: [{ w: null, r: null, rir: null, done: editor.mode === "edit" }] }); changed(); render(); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 30); }); break;
    case "add-set": {
      const i = +el.dataset.ex, ex = editor.w.exercises[i];
      const last = ex.sets[ex.sets.length - 1];
      ex.sets.push({ w: last?.w ?? null, r: null, rir: null, done: editor.mode === "edit" });
      changed(); rerenderCard(i); break;
    }
    case "done": {
      const i = +row.dataset.ex, j = +row.dataset.set, s = editor.w.exercises[i].sets[j];
      if (!s.done) {
        const p = (previousFor(editor.w.exercises[i].exId, editor.w.id, editor.mode === "edit" ? editor.w.date : null) || [])[j];
        if (s.w == null && p) s.w = p.w;
        if (s.r == null && p) s.r = p.r;
        if (s.rir == null && p && s.r === p.r) s.rir = p.rir;
        if (s.r == null) { toast("Bitte Wiederholungen eintragen"); row.querySelector('[data-k="r"]').focus(); return; }
      }
      s.done = !s.done; changed(); rerenderCard(i); break;
    }
    case "use-prev": {
      const i = +row.dataset.ex, j = +row.dataset.set, s = editor.w.exercises[i].sets[j];
      const p = (previousFor(editor.w.exercises[i].exId, editor.w.id, editor.mode === "edit" ? editor.w.date : null) || [])[j];
      if (p) { s.w = p.w; s.r = p.r; s.rir = p.rir; changed(); rerenderCard(i); }
      break;
    }
    case "set-menu": {
      const i = +row.dataset.ex, j = +row.dataset.set;
      const r = await ask(`Satz ${j + 1}`, null, [{ label: "Satz duplizieren", value: "dup" }, { label: "Satz löschen", value: "del", style: "danger" }, { label: "Abbrechen", value: null }]);
      const sets = editor.w.exercises[i].sets;
      if (r === "del") sets.splice(j, 1);
      if (r === "dup") sets.splice(j + 1, 0, Object.assign({}, sets[j], { done: editor.mode === "edit" }));
      if (r) { changed(); rerenderCard(i); }
      break;
    }
    case "ex-menu": {
      const i = +el.dataset.ex, list = editor.w.exercises;
      const opts = [];
      if (i > 0) opts.push({ label: "Nach oben", value: "up" });
      if (i < list.length - 1) opts.push({ label: "Nach unten", value: "down" });
      opts.push({ label: "Übung ersetzen", value: "swap" }, { label: "Verlauf & Graph ansehen", value: "info" }, { label: "Übung entfernen", value: "rm", style: "danger" }, { label: "Abbrechen", value: null });
      const r = await ask(exName(list[i].exId), null, opts);
      if (r === "up") [list[i - 1], list[i]] = [list[i], list[i - 1]];
      if (r === "down") [list[i + 1], list[i]] = [list[i], list[i + 1]];
      if (r === "rm") list.splice(i, 1);
      if (r === "swap") return openPicker(exId => { list[i].exId = exId; changed(); render(); });
      if (r === "info") return push({ type: "exercise", id: list[i].exId });
      if (r) { changed(); render(); }
      break;
    }
    case "new-ex": { const nid = await exerciseForm(null); if (nid) render(); break; }
    case "edit-ex": { await exerciseForm(exById(id)); render(); break; }
    case "delete-ex": {
      const used = S.workouts.some(w => w.exercises.some(x => x.exId === id)) || S.draft?.exercises.some(x => x.exId === id);
      if (used) { await ask("Übung wird verwendet", "Diese Übung kommt in gespeicherten Trainings vor und kann deshalb nicht gelöscht werden. Du kannst sie aber umbenennen.", [{ label: "OK", value: true }]); break; }
      const ok = await ask("Übung löschen?", exName(id), [{ label: "Löschen", value: true, style: "danger" }, { label: "Abbrechen", value: null }]);
      if (ok) { S.meta.exercises = S.meta.exercises.filter(x => x.id !== id); Store.saveMeta(); back(); }
      break;
    }
    case "excat": ui.exCat = el.dataset.c; render(); break;
    case "metric": ui.metric = el.dataset.m; render(); break;
    case "range": ui.range = el.dataset.r; render(); break;
    case "toggle-table": ui.table = !ui.table; render(); break;
    case "unit": S.meta.settings.unit = el.dataset.u; Store.saveMeta(); render(); break;
    case "formula": S.meta.settings.formula = el.dataset.f; Store.saveMeta(); render(); break;
    case "export-file": {
      const name = `gymlog-backup-${new Date().toISOString().slice(0, 10)}.json`;
      const blob = new Blob([backupJson()], { type: "application/json" });
      if (window.claude && typeof window.claude.use === "function") {
        try { const dl = await window.claude.use("downloads"); if (dl) { await dl.save({ filename: name, data: backupJson() }); toast("Backup gespeichert"); break; } }
        catch (err) { toast("Download abgebrochen – alternativ „In Zwischenablage kopieren“"); break; }
      }
      try {
        const file = new File([blob], name, { type: "application/json" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); break; }
      } catch (err) { if (err && err.name === "AbortError") break; }
      try { const u = URL.createObjectURL(blob); const l = document.createElement("a"); l.href = u; l.download = name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); toast("Backup erstellt"); }
      catch { toast("Download nicht möglich – nutze „In Zwischenablage kopieren“"); }
      break;
    }
    case "export-copy": try { await navigator.clipboard.writeText(backupJson()); toast("Backup kopiert – z. B. in Notizen einfügen"); } catch { toast("Kopieren nicht erlaubt"); } break;
    case "import-paste": {
      const m = openModal(`<h2>Backup-Text einfügen</h2><textarea class="field" id="imptxt" style="min-height:160px;margin:10px 0" placeholder='{"app":"gymlog", …}'></textarea>
        <button class="btn primary" data-go>Importieren</button><button class="btn" data-close>Abbrechen</button>`, { center: true });
      m.onclick = ev => { if (ev.target.closest("[data-go]")) { const t = $("#imptxt").value; closeModal(); importData(t); } else if (ev.target.hasAttribute("data-close")) closeModal(); };
      break;
    }
    case "wipe": {
      const ok = await ask("Alle Daten löschen?", "Alle Trainings und eigenen Übungen werden gelöscht. Sichere vorher ein Backup!", [{ label: "Endgültig löschen", value: true, style: "danger" }, { label: "Abbrechen", value: null }]);
      if (!ok) break;
      for (const w of S.workouts) Store.deleteWorkout(w.id);
      S.workouts = []; S.draft = null; editor = null; seedMeta(); Store.saveMeta(); Store.saveDraft(); toast("Alle Daten gelöscht"); render();
      break;
    }
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "exq") { ui.exSearch = t.value; const pos = t.selectionStart; render(); const n = $("#exq"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (!editor) return;
  if (t.dataset.f) {
    const f = t.dataset.f;

    else editor.w[f] = t.value;

  }
  const row = t.closest(".setrow");
  if (row && t.dataset.k) {
    const i = +row.dataset.ex, j = +row.dataset.set, s = editor.w.exercises[i].sets[j];
    let v = num(t.value);
    if (t.dataset.k === "r" && v != null) v = Math.round(v);
    s[t.dataset.k] = v;
    const sum = $("#sum-" + i); if (sum) sum.innerHTML = exSummary(editor.w.exercises[i]);
    changed();
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "impfile" && e.target.files[0]) { const r = new FileReader(); r.onload = () => importData(r.result); r.readAsText(e.target.files[0]); e.target.value = ""; }
  if (e.target.dataset?.f === "date" && editor) { render(); }
});
window.addEventListener("scroll", () => $("#hdr").classList.toggle("scrolled", window.scrollY > 4), { passive: true });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (cur()?.type === "exercise" && !ui.table) render(); }, 150); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && editor?.mode === "active") { clearTimeout(draftTimer); Store.saveDraft(); } });

/* ---------- boot ---------- */
(function boot() {
  const local = Store.readLocal();
  if (local && local.meta) { S = Object.assign(S, local); S.meta.deleted ||= {}; S.meta.settings ||= { unit: "kg", formula: "epley" }; S.workouts ||= []; }
  if (!Array.isArray(S.meta.exercises) || !S.meta.exercises.length) { seedMeta(); Store.writeLocal(); }
  if (S.draft) { editor = { mode: "active", w: S.draft }; nav.tab = "workout"; }
  render();
  Store.connect();
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && window.top === window.self) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
